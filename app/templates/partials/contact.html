<section class="section alt" id="contact">
  <div class="wrap contact-grid">
    <div class="contact-info">
      <h2>Have something to build, grow, or tell the world about?</h2>
      <p>Let's talk. The first conversation is free.</p>
      <a class="email-link" href="mailto:hello@srassociates.co">hello@srassociates.co</a>
    </div>

    {% if sent %}
    <div class="card-form form-sent" role="status">
      <h3>Thanks — we've got it.</h3>
      <p>We'll be in touch shortly at the email you provided.</p>
      <a class="btn btn-outline" href="/">Back to home</a>
    </div>
    {% else %}
    <!-- Delivered via Web3Forms (free). Replace the access_key with your own from https://web3forms.com -->
    <form class="card-form" action="https://api.web3forms.com/submit" method="POST">
      <input type="hidden" name="access_key" value="0b72b9c7-a010-45e9-8722-ae2a340068d2">
      <input type="hidden" name="subject" value="New enquiry from srassociates.co">
      <input type="hidden" name="from_name" value="SR Associates Website">
      <input type="hidden" name="redirect" value="https://srassociates.co/thanks#contact">
      <div class="form-row">
        <div class="field">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" autocomplete="name" required>
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="email" required>
        </div>
      </div>
      <div class="field">
        <label for="company">Company</label>
        <input type="text" id="company" name="company" autocomplete="organization">
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4" required></textarea>
      </div>
      <!-- honeypot (Web3Forms) — hidden from people, catches bots -->
      <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit" class="btn btn-orange">Send</button>
    </form>
    {% endif %}
  </div>
</section>
